name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  # The toolchain process-watch builds with; test.yml and release.yml name the same one.
  RUST_VERSION: 1.95.0
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            platform: linux
            arch: x86_64
          - name: macOS Intel
            os: macos-15-intel
            platform: macos
            arch: x86_64
          - name: macOS Apple Silicon
            os: macos-15
            platform: macos
            arch: aarch64
          - name: Windows x86_64
            os: windows-latest
            platform: windows
            arch: x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Read the version
        run: |
          version=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Check the tag names the project's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION" >&2
            exit 1
          fi
      # The macOS binaries run on macOS 12 and later.
      - name: Target macOS 12 (macOS)
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ runner.os == 'Linux' && 'x86_64-unknown-linux-musl' || '' }}
      - name: Install rpmbuild (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "choco failed (exit $LASTEXITCODE)" }
          }

      - name: Tests
        run: cargo test --locked
      - name: Build and package
        run: scripts/package.sh --installers dist
      - name: List the packages
        run: ls -la dist

      # Each archive as a user gets it, unpacked and run end to end.
      - name: Smoke test the packaged binary
        run: |
          mkdir try
          if [ "$RUNNER_OS" = Windows ]; then
            7z x -otry "dist/process-watch-$VERSION-windows-x86_64.zip" > /dev/null
            tests/smoke.sh "try/process-watch-$VERSION-windows-x86_64/pw.exe"
          else
            tar -xzf dist/process-watch-*.tar.gz -C try
            tests/smoke.sh "try/process-watch-$VERSION-${{ matrix.platform }}-${{ matrix.arch }}/pw"
          fi
      - name: Install from the tarball (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          try/process-watch-*/install.sh --prefix "$RUNNER_TEMP/installed" --no-service
          [ "$("$RUNNER_TEMP/installed/bin/pw" --version)" = "pw $VERSION" ]
      # Nothing in the binary may ask for a macOS newer than 12.
      - name: Check the binary runs on macOS 12 (macOS)
        if: runner.os == 'macOS'
        run: |
          vtool -show-build try/process-watch-*/pw
          vtool -show-build try/process-watch-*/pw | grep -Eq 'minos 12\.0$'
      # Each distribution package as a user gets it: the .deb on this Ubuntu
      # and on Debian 11, whose dpkg predates zstd, and the .rpm on Fedora.
      - name: Install the .deb and .rpm and run pw (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/process-watch_*.deb
          [ "$(/usr/bin/pw --version)" = "pw $VERSION" ]
          systemd-analyze verify /usr/lib/systemd/user/process-watch.service
          sudo apt-get remove -y process-watch
          docker run --rm -v "$PWD/dist:/dist:ro" debian:11 \
            sh -c 'dpkg -i /dist/process-watch_*.deb && pw --version'
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:41 \
            sh -c 'dnf -y -q install /dist/process-watch-*.rpm && pw --version'

      # The zips and the installer as a user gets them: each zip names its
      # entries with forward slashes and the portable one keeps recordings in
      # its data folder; the installer installs for the current user with pw
      # on the PATH and the recorder at sign-in, uninstalls cleanly, stopping
      # its recorder, and extracts portably.
      - name: Check the zips and the setup program (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-Version($exe) {
            $printed = (& $exe --version | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw "$exe exited with $LASTEXITCODE" }
            if ($printed -ne "pw $env:VERSION") { throw "$exe printed '$printed'" }
          }
          function Assert-Portable($folder) {
            if (-not (Test-Path "$folder\data" -PathType Container)) { throw "$folder has no data folder" }
            $cleared = (& "$folder\pw.exe" --clear | Out-String).Trim()
            if (-not $cleared.EndsWith("from $folder\data")) { throw "a portable pw recorded elsewhere: $cleared" }
          }
          # Start-Process -Wait waits for every process the program starts.
          # Setup starts the recorder, which runs until stopped, so setup is
          # waited for alone; reading Handle keeps the process open so its
          # exit code survives its exit.
          function Invoke-Setup($arguments) {
            $run = Start-Process $setup -PassThru -ArgumentList (@('/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER') + $arguments)
            $null = $run.Handle
            $run.WaitForExit()
            if ($run.ExitCode -ne 0) { throw "setup exited with $($run.ExitCode)" }
          }
          # The uninstaller hands its work, the PATH edit last, to a copy of
          # itself in TEMP (_iu*.tmp) and exits; -Wait waits for that copy too.
          function Invoke-Uninstall($folder) {
            $run = Start-Process "$folder\unins000.exe" -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES'
            if ($run.ExitCode -ne 0) { throw "the uninstaller exited with $($run.ExitCode)" }
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($zip in Get-ChildItem dist\*.zip) {
            $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
            $named = @($archive.Entries | Where-Object { $_.FullName.Contains('\') })
            $archive.Dispose()
            if ($named.Count -gt 0) { throw "$($zip.Name) names entries with backslashes" }
          }
          $unzipped = "$env:RUNNER_TEMP\pw-portable-zip"
          Expand-Archive (Get-ChildItem dist\*-portable.zip).FullName $unzipped
          Assert-Portable (Get-ChildItem $unzipped -Directory | Select-Object -First 1).FullName

          $setup = (Get-ChildItem dist\process-watch-*-setup.exe).FullName
          $dir = "$env:RUNNER_TEMP\pw-installed"
          Invoke-Setup @('/TASKS=envpath,recorder', "/DIR=$dir")
          Assert-Version "$dir\pw.exe"
          if (-not ([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' -contains $dir)) { throw "setup did not put $dir on the PATH" }
          $shortcut = Join-Path ([Environment]::GetFolderPath('Startup')) 'process-watch recorder.lnk'
          if (-not (Test-Path $shortcut)) { throw "setup did not start the recorder at sign-in" }
          # A recorder of this installation, running, that the uninstaller has to stop.
          $recorder = Start-Process "$dir\pw.exe" -ArgumentList 'record', '-d', "$env:RUNNER_TEMP\pw-recorder-data" -WindowStyle Hidden -PassThru
          Invoke-Uninstall $dir
          if (-not $recorder.HasExited) { throw "the uninstaller left the recorder running" }
          if (Test-Path "$dir\pw.exe") { throw "the uninstaller left pw.exe" }
          if (Test-Path $shortcut) { throw "the uninstaller left the sign-in shortcut" }
          if ([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' -contains $dir) { throw "the uninstaller left $dir on the PATH" }

          $portable = "$env:RUNNER_TEMP\pw-portable"
          Invoke-Setup @('/TASKS=portablemode', "/DIR=$portable")
          if (Test-Path "$portable\unins000.exe") { throw "the portable extraction has an uninstaller" }
          Assert-Version "$portable\pw.exe"
          Assert-Portable $portable

      - uses: actions/upload-artifact@v5
        with:
          name: process-watch-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error

  # FreeBSD has no hosted runner, so the package builds in a FreeBSD VM. A
  # binary built on FreeBSD 14 runs on 14 and later.
  build-freebsd:
    name: FreeBSD x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Read the version
        run: |
          version=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Check the tag names the project's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION" >&2
            exit 1
          fi

      # The tarball as a user gets it, unpacked, smoke tested, installed and run.
      - name: Build, package, install and run in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          envs: RUST_VERSION VERSION
          prepare: |
            pkg install -y bash curl
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST_VERSION"
          run: |
            set -e
            . "$HOME/.cargo/env"
            cargo test --locked
            scripts/package.sh dist
            ls -la dist
            mkdir try
            tar -xzf dist/process-watch-*-freebsd-x86_64.tar.gz -C try
            tests/smoke.sh "try/process-watch-$VERSION-freebsd-x86_64/pw"
            try/process-watch-*/install.sh --prefix "$PWD/installed" --no-service
            [ "$(installed/bin/pw --version)" = "pw $VERSION" ]
      - uses: actions/upload-artifact@v5
        with:
          name: process-watch-freebsd-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish
    needs: [build, build-freebsd]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## " v " - ") == 1 || $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q . notes.md; then
            echo "::error::CHANGELOG.md has no ## $version section"
            exit 1
          fi
      - uses: actions/download-artifact@v6
        with:
          path: dist
          pattern: process-watch-*
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "process-watch $GITHUB_REF_NAME" --notes-file notes.md
